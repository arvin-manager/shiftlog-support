const data={"en": {"name": "ShiftLog", "home": "Overview", "help": "Support", "privacy": "Privacy", "tag": "Your shifts, hours and pay — in one place.", "intro": "Keep track of changing shifts, record the hours you actually worked, and see estimated pay alongside your spending budget.", "features": ["Plan shifts with your own names, times and colors. Use repeating schedules or mark a day off.", "Record actual start and finish times, unpaid breaks and allowances. Choose how to record an early finish.", "See pay estimates based on your settings and keep track of expenses and a monthly spending limit.", "Share a shift calendar or export a selected date range as CSV, PDF or an image."], "helpTitle": "A little help with your workday", "steps": [["Getting started", "Set your work region, currency, pay rules and pay period in Settings. Then add a shift from Today or the calendar."], ["Changing a shift or taking leave", "Select the date in Shifts and edit its schedule. Choose Day off to replace a planned shift. Review the confirmation if that day already has work records."], ["Recording work hours", "Open Record hours to enter actual times and unpaid breaks. Finish shift offers a quick way to complete a shift; if it is early, choose the calculation method that matches your work."], ["Setting a budget", "Open Income → Budget and set a monthly spending limit. Remaining budget is your limit minus recorded spending, not your bank balance or wages received."], ["Backing up and restoring", "Local records work without an account. In Settings → Cloud backup, sign in with Google or Apple to manually back up or restore. The latest two backups are kept; signing out does not delete them."], ["Exporting and sharing", "Choose a date range with scheduled shifts. Empty ranges cannot be shared. Preview your export before sharing it: it may contain personal work or pay information."]], "contact": "Report an issue", "contactNote": "GitHub issues are public. Do not post passwords, account identifiers, unredacted pay records or other private information. A GitHub account is needed to post. Account and backup deletion are available directly inside the app.", "policy": "Privacy policy", "date": "Effective date: October 12, 2026", "sections": [["Who operates the app", "ShiftLog and its localized app names are published by the independent developer arvin-manager. For privacy questions, use the support channel below. This policy applies to the iOS app and this informational website."], ["Records on your device", "Shifts, work hours, pay settings, expenses and app preferences are stored locally. We do not send the contents of your ledger to analytics or advertising services. Exporting or sharing is initiated by you; recipients and the apps you choose may process those files under their own policies."], ["Optional sign-in and cloud backup", "Google or Apple sign-in uses Firebase Authentication, which processes your provider identity, account ID, email and display name when supplied. We do not receive your Google or Apple password. When you manually back up, your shifts, hours, pay, expenses and settings are stored in Cloud Firestore under your account. Two latest backups are retained. Backups are compressed, not encrypted with a key held only by you. Access is restricted to the signed-in account by server rules; Firebase processes the data to provide the service."], ["Usage analytics", "Firebase Analytics may process app-instance and device identifiers, app/device details, interaction events, approximate location derived from network information, and related diagnostic data. Analytics is enabled by default and can be switched off in Settings. We do not attach ledger amounts, shift details, email or an account user ID to our custom analytics events."], ["Advertisements", "Google AdMob serves non-personalized ads. It and its partners may process IP-derived approximate location, device identifiers, ad views and interactions, app/device details and diagnostic information for ad delivery, measurement and fraud prevention. Non-personalized ads still involve data processing. Where required, Google’s consent form appears before eligible ad requests; ad privacy choices are available in Settings when provided by the service. We do not request cross-app tracking permission or use the app’s ledger for advertising."], ["Holiday requests and website", "Holiday requests to Nager.Date, Calendarific and our holiday cache use the selected country/region and year, not your shifts or income. Network providers can receive IP addresses and normal connection metadata. GitHub Pages hosts this website and may keep request logs. This website has no analytics scripts, ad scripts, sign-in or tracking cookies; a language selection is held only in the URL. GitHub processes issue submissions under its own policy."], ["Retention and deletion", "Local records remain until you delete them or remove the app, subject to device backups. Cloud backups remain until you delete them, delete your app account, or replace an older backup; only the latest two are retained. Settings → Cloud backup lets you delete cloud backups or the app account, with reauthentication when required. Local records are not removed by cloud deletion. Analytics and advertising providers apply their own retention rules; turning off collection does not retrospectively erase their existing data."], ["Your choices and rights", "You can use local features without signing in, export your records, disable analytics, manage available ad consent options and delete your cloud backups or app account. Depending on where you live, you may also have rights to access, correct, delete or object to processing, withdraw consent or contact a data-protection authority. Contact us through Support for requests beyond the in-app controls; do not submit private data in a public issue."], ["Security and international processing", "Network requests use HTTPS. Cloud data is subject to Firebase access controls and provider security measures. Cloud Firestore is configured in the United States; Google, Apple and GitHub may process data in other countries. No storage or transfer method is completely secure. The app does not provide end-to-end encrypted backup."], ["Children and policy changes", "The app is a personal work-recording tool and is not designed for children. We do not knowingly request children’s information. Contact Support if you believe such data has been provided. This policy may change when functionality or providers change; the effective date on this page will be updated."]]}, "zh-TW": {"name": "排班記", "home": "功能介紹", "help": "使用幫助", "privacy": "隱私政策", "tag": "班次、工時與薪資，一目了然。", "intro": "整理變動的班表，記錄實際工時，掌握預估薪資與每月支出預算。", "features": ["自訂班次名稱、時間與顏色，安排循環班表，也能將班次改為休息日。", "記錄實際上下班時間、無薪休息與補助；提前下班時自行選擇記錄方式。", "依你的薪資設定查看預估收入，記錄支出並設定每月支出上限。", "分享排班日曆，或按自選日期範圍匯出 CSV、PDF、圖片。"], "helpTitle": "讓每天的工作記錄更清楚", "steps": [["第一次使用", "到設定選擇工作地區、貨幣、薪資規則與發薪週期，再從首頁或日曆新增班次。"], ["改班與請假", "在班次頁選擇日期並修改排班，選擇休息日即可替換原班次。若當天已有工時記錄，請先閱讀確認提示。"], ["記錄工時", "在「記錄工時」填寫實際時間與無薪休息。「完成班次」提供快速完成入口；提前完成時，請選擇符合實際情況的計算方式。"], ["設定預算", "開啟收入 → 預算，設定每月支出上限。剩餘預算是上限減去已記錄支出，不是銀行餘額或已領薪資。"], ["備份與恢復", "本機功能不需要登入。到設定 → 雲端備份，使用 Google 或 Apple 登入後手動備份或恢復；雲端保留最新兩份，登出不會刪除備份。"], ["匯出與分享", "選擇有排班資料的日期範圍；空白範圍不能分享。分享前請檢查內容，匯出檔案可能包含個人工時或薪資。"]], "contact": "回報問題", "contactNote": "GitHub 問題回報是公開的，請勿張貼密碼、帳號識別資料、未遮蔽的薪資記錄或其他私人資訊。發文需要 GitHub 帳號。刪除帳號與雲端備份可直接在 App 內操作。", "policy": "隱私政策", "date": "生效日期：2026 年 10 月 12 日", "sections": [["營運者與適用範圍", "排班記及其他語言版本由獨立開發者 arvin-manager 發布。隱私相關問題請使用下方支援管道。本政策適用於 iOS App 與本介紹網站。"], ["裝置上的記錄", "班次、工時、薪資設定、支出與偏好保存在裝置。我們不會把帳本內容傳給分析或廣告服務。匯出與分享由你主動操作；接收者及你選擇的 App 可能依自己的政策處理檔案。"], ["選用登入與雲端備份", "Google／Apple 登入由 Firebase Authentication 處理，會處理登入提供者身分、帳號 ID，以及提供者回傳的電子郵件與顯示名稱。我們不會取得 Google／Apple 密碼。手動備份時，班次、工時、薪資、支出與設定會存到該帳號的 Cloud Firestore，保留最新兩份。備份採壓縮格式，並非只有你持有金鑰的加密。伺服器規則限制僅登入該帳號者存取；Firebase 為提供服務而處理資料。"], ["使用情況分析", "Firebase Analytics 可能處理 App 執行個體與裝置識別資訊、App／裝置資訊、互動事件、依網路資訊推估的大致位置及診斷資料。分析預設開啟，可在設定關閉。我們不會在自訂分析事件中附加帳本金額、班次明細、電子郵件或帳號使用者 ID。"], ["廣告", "Google AdMob 提供非個人化廣告。它與合作夥伴可能處理 IP 推估的大致位置、裝置識別資訊、廣告展示與互動、App／裝置資訊及診斷資料，用於投放、衡量與防詐欺。非個人化廣告仍涉及資料處理。需要時會先顯示 Google 同意表單；服務提供時可到設定調整廣告隱私選項。我們不要求跨 App 追蹤權限，也不使用帳本內容投放廣告。"], ["節假日查詢與網站", "Nager.Date、Calendarific 與節假日快取僅使用所選國家／地區與年份，不接收班次或收入。網路服務提供者仍可能取得 IP 與一般連線資訊。網站由 GitHub Pages 託管，可能保留請求紀錄。本網站不使用分析或廣告腳本、登入或追蹤 Cookie；語言選擇僅保留在網址。GitHub 依自己的政策處理問題回報。"], ["保存與刪除", "本機記錄保留至你刪除或移除 App，裝置備份另依系統設定。雲端備份保留至刪除備份、刪除 App 帳號或舊版本被替換，最多保留最新兩份。可在設定 → 雲端備份刪除備份或帳號，需要時會重新驗證；本機記錄不會因此刪除。分析與廣告資料的保存期限由服務提供者決定；關閉收集不會自動刪除已收集的資料。"], ["選擇與權利", "你可以不登入使用本機功能、匯出記錄、關閉分析、管理可用的廣告同意選項，以及刪除雲端備份或帳號。依所在地法律，也可能享有查閱、更正、刪除、反對處理、撤回同意或向主管機關申訴的權利。超出 App 操作範圍的需求請聯絡支援，請勿在公開回報中提供私人資料。"], ["安全與跨境處理", "網路請求使用 HTTPS，雲端資料受 Firebase 存取規則與服務提供者安全措施保護。Cloud Firestore 設於美國；Google、Apple 與 GitHub 可能在其他國家處理資料。任何儲存或傳輸方式都無法保證絕對安全。備份不提供端對端加密。"], ["兒童與政策更新", "本 App 是個人工時記錄工具，並非為兒童設計；我們不會刻意要求兒童提供資料。若懷疑已提供這類資料，請聯絡支援。功能或服務提供者變更時可能更新本政策，並同步更新本頁生效日期。"]]}, "zh-CN": {"name": "排班记", "home": "功能介绍", "help": "使用帮助", "privacy": "隐私政策", "tag": "班次、工时与工资，一目了然。", "intro": "整理变动的排班，记录实际工时，掌握预计工资与每月支出预算。", "features": ["自定义班次名称、时间和颜色，设置循环排班，也能将班次改为休息日。", "记录实际上下班时间、无薪休息和补助；提前下班时自行选择记录方式。", "根据工资设置查看预计收入，记录支出并设置每月支出上限。", "分享排班日历，或按自选日期范围导出 CSV、PDF、图片。"], "helpTitle": "让每天的工作记录更清楚", "steps": [["首次使用", "在设置中选择工作地区、货币、工资规则和发薪周期，再从首页或日历新增班次。"], ["改班与请假", "在班次页选择日期并更改排班，选择休息日即可替换原班次。如果当天已有工时记录，请先阅读确认提示。"], ["记录工时", "在“记录工时”填写实际时间和无薪休息。“完成班次”提供快速完成入口；提前完成时，请选择符合实际情况的计算方式。"], ["设置预算", "打开收入 → 预算，设置每月支出上限。剩余预算是上限减去已记录支出，不是银行余额或已收到的工资。"], ["备份与恢复", "本地功能无需登录。在设置 → 云端备份，使用 Google 或 Apple 登录后手动备份或恢复；保留最新两份，退出登录不会删除备份。"], ["导出与分享", "选择有排班数据的日期范围；空白范围不能分享。分享前请检查内容，文件可能包含个人工时或工资信息。"]], "contact": "反馈问题", "contactNote": "GitHub 问题反馈是公开的，请勿发布密码、账号识别信息、未经遮盖的工资记录或其他私人信息。发布需要 GitHub 账号。删除账号和云端备份可以直接在 App 内操作。", "policy": "隐私政策", "date": "生效日期：2026 年 10 月 12 日", "sections": [["运营者与适用范围", "排班记及其他语言版本由独立开发者 arvin-manager 发布。隐私相关问题请使用下方支持渠道。本政策适用于 iOS App 和本介绍网站。"], ["设备上的记录", "班次、工时、工资设置、支出和偏好保存在设备。我们不会将账本内容发送给分析或广告服务。导出与分享由你主动操作；接收者及你选择的 App 可能按照各自的政策处理文件。"], ["可选登录与云端备份", "Google／Apple 登录由 Firebase Authentication 处理，包括登录提供方身份、账号 ID，以及提供方返回的邮箱和显示名称。我们不会获取 Google／Apple 密码。手动备份时，班次、工时、工资、支出与设置会存入该账号的 Cloud Firestore，保留最新两份。备份采用压缩格式，并非只有你持有密钥的加密。服务器规则限制仅该登录账号可访问；Firebase 为提供服务而处理数据。"], ["使用情况分析", "Firebase Analytics 可能处理 App 实例与设备标识、App／设备信息、交互事件、通过网络信息推算的大致位置和诊断数据。分析默认开启，可以在设置中关闭。我们不会在自定义分析事件中附加账本金额、班次详情、邮箱或账号用户 ID。"], ["广告", "Google AdMob 提供非个性化广告。它与合作伙伴可能处理 IP 推算的大致位置、设备标识、广告展示和交互、App／设备信息及诊断数据，用于投放、衡量和防欺诈。非个性化广告仍涉及数据处理。需要时会先显示 Google 同意表单；服务提供时可在设置调整广告隐私选项。我们不要求跨 App 跟踪权限，也不使用账本内容投放广告。"], ["节假日与网站", "Nager.Date、Calendarific 和节假日缓存仅使用所选国家／地区与年份，不接收班次或收入。网络服务提供方仍可能获取 IP 和一般连接信息。网站由 GitHub Pages 托管，可能保存请求日志。本网站没有分析或广告脚本、登录或跟踪 Cookie；语言选择仅保留在网址。GitHub 按其政策处理问题反馈。"], ["保存与删除", "本地记录保留至你删除或移除 App，设备备份另依系统设置。云端备份保留至删除备份、删除 App 账号或旧版本被替换，最多保留最新两份。在设置 → 云端备份可以删除备份或账号，需要时会重新验证；不会同时删除本地记录。分析与广告数据的保存期限由服务提供方决定；关闭收集不会自动删除此前收集的数据。"], ["选择与权利", "你可以不登录使用本地功能、导出记录、关闭分析、管理可用的广告同意选项，以及删除云端备份或账号。按照所在地法律，也可能享有查询、更正、删除、反对处理、撤回同意或向主管机关投诉的权利。超出 App 操作范围的请求请联系支持，请勿在公开反馈中提供私人数据。"], ["安全与跨境处理", "网络请求使用 HTTPS，云端数据受 Firebase 访问规则和服务提供方安全措施保护。Cloud Firestore 位于美国；Google、Apple 和 GitHub 可能在其他国家处理数据。任何存储或传输方式都不能保证绝对安全。备份不提供端到端加密。"], ["儿童与政策更新", "本 App 是个人工时记录工具，不是为儿童设计；我们不会刻意要求儿童提供数据。若怀疑已提供此类数据，请联系支持。功能或服务提供方变化时可能更新政策，并同步更新本页生效日期。"]]}, "ja": {"name": "シフト手帳", "home": "アプリ紹介", "help": "使い方", "privacy": "プライバシー", "tag": "シフト、勤務時間、給与をひとまとめに。", "intro": "変わりやすいシフトを整理し、実際の勤務時間と給与の見込み、毎月の支出を確認できます。", "features": ["名前・時間・色を自由に設定。繰り返しのシフトや休日も管理できます。", "実際の出退勤、無給の休憩、手当を記録。早退時は記録方法を選べます。", "設定に基づく給与の見込みを確認し、支出と月の予算を管理できます。", "シフトカレンダーを共有し、指定期間を CSV・PDF・画像で書き出せます。"], "helpTitle": "毎日の記録をわかりやすく", "steps": [["最初の設定", "設定で勤務する地域、通貨、給与の計算方法、支給周期を選び、ホームやカレンダーからシフトを追加してください。"], ["シフト変更・休暇", "シフト画面で日付を選び、予定を編集します。休日を選ぶとその日のシフトを置き換えます。勤務記録がある場合は確認メッセージをお読みください。"], ["勤務時間の記録", "実際の出退勤と無給の休憩を入力します。シフトを終了する操作では、早退の場合に実際の勤務に合う計算方法を選んでください。"], ["予算の設定", "収入 → 予算で月の支出上限を設定します。残り予算は上限から記録した支出を引いた額で、銀行残高や受け取った給与ではありません。"], ["バックアップ・復元", "端末内の機能はログイン不要です。設定 → クラウドバックアップで Google または Apple にログインし、手動で保存・復元します。最新 2 件が保存され、ログアウトでは削除されません。"], ["書き出し・共有", "シフトのある期間を選んでください。空の期間は共有できません。ファイルに勤務や給与の情報が含まれるため、共有前に内容をご確認ください。"]], "contact": "問題を報告", "contactNote": "GitHub の報告は公開されます。パスワード、アカウント識別情報、給与明細などの個人情報を投稿しないでください。投稿には GitHub アカウントが必要です。アプリのアカウントとバックアップはアプリ内で削除できます。", "policy": "プライバシーポリシー", "date": "施行日：2026 年 10 月 12 日", "sections": [["運営者・対象", "本アプリと各言語版は独立開発者 arvin-manager が公開しています。お問い合わせは下記のサポートへ。本ポリシーは iOS アプリと本サイトに適用されます。"], ["端末内の記録", "シフト、勤務時間、給与設定、支出、設定は端末に保存されます。帳簿の内容を分析や広告サービスへ送信しません。書き出しと共有はご自身の操作で行い、共有先のアプリや受信者にはそれぞれのポリシーが適用されます。"], ["任意のログイン・バックアップ", "Firebase Authentication は Google／Apple の識別情報、アカウント ID、提供されるメールアドレスや表示名を処理します。パスワードは受け取りません。手動バックアップでは勤務・給与・支出・設定がアカウントの Cloud Firestore に保存され、最新 2 件を保持します。圧縮されたデータであり、利用者だけが鍵を持つ暗号化ではありません。サーバールールで同じログインアカウントにアクセスを制限し、Firebase がサービス提供のために処理します。"], ["利用状況の分析", "Firebase Analytics はアプリや端末の識別子・情報、操作、ネットワーク情報から推定する大まかな位置、診断情報を処理する場合があります。初期設定は有効で、設定から無効にできます。独自の分析イベントには帳簿金額、シフト詳細、メールアドレス、アカウントのユーザー ID を付けません。"], ["広告", "Google AdMob の非パーソナライズ広告を表示します。Google やパートナーは IP による大まかな位置、端末識別子、広告表示・操作、アプリ・端末情報、診断情報を配信・測定・不正防止のために処理する場合があります。非パーソナライズ広告でもデータは処理されます。必要な地域では広告リクエストに先立ち同意画面を表示し、提供される場合は設定で選択を変更できます。アプリ間の追跡許可は求めず、帳簿を広告に使いません。"], ["祝日サービス・ウェブサイト", "Nager.Date、Calendarific、祝日キャッシュには国・地域と年を送信し、勤務や収入は送りません。サービスには IP や通常の接続情報が届く場合があります。GitHub Pages はサイトをホストし、リクエストログを保持する場合があります。本サイトには分析・広告スクリプト、ログイン、追跡 Cookie はなく、言語は URL だけに保持します。報告は GitHub のポリシーに従います。"], ["保存・削除", "端末の記録は削除またはアプリ削除まで保持され、端末バックアップは OS の設定に従います。クラウドは最新 2 件を保持し、削除、アカウント削除、旧版の置き換えまで保存します。設定 → クラウドバックアップから必要な再認証を経て削除でき、端末の記録は消えません。分析・広告データは提供者の保存ルールに従い、収集を止めても過去のデータが自動削除されるわけではありません。"], ["選択・権利", "ログインせずに使用、記録の書き出し、分析の停止、利用可能な広告同意設定、クラウドやアカウントの削除ができます。地域の法律により開示・訂正・削除・異議申立て・同意撤回・監督機関への申立て等の権利がある場合があります。アプリ内で扱えない依頼はサポートへ。公開の報告に個人情報を載せないでください。"], ["安全性・国外での処理", "通信は HTTPS を使用し、Firebase のアクセス制御と提供者の安全対策を使用します。Cloud Firestore は米国に配置され、Google、Apple、GitHub が他国で処理する場合があります。完全な安全性は保証できず、バックアップはエンドツーエンド暗号化ではありません。"], ["子ども・改訂", "個人の勤務記録用であり、子ども向けに設計されていません。子どもの情報を意図的に求めません。該当する情報の提供が疑われる場合はサポートへご連絡ください。機能や提供者が変わる際に改訂し、施行日を更新します。"]]}, "ko": {"name": "근무수첩", "home": "앱 소개", "help": "사용 도움말", "privacy": "개인정보", "tag": "근무표, 근무 시간, 급여를 한곳에서.", "intro": "변동되는 근무표를 정리하고 실제 근무 시간과 예상 급여, 월별 지출 예산을 확인하세요.", "features": ["이름·시간·색상을 직접 정하고 반복 근무나 휴무일을 관리할 수 있어요.", "실제 출퇴근 시간, 무급 휴게 시간, 수당을 기록하고 조기 퇴근 시 기록 방식을 선택하세요.", "설정한 급여 기준으로 예상 금액을 확인하고 지출과 월별 지출 한도를 관리하세요.", "근무 달력을 공유하거나 원하는 기간을 CSV, PDF, 이미지로 내보내세요."], "helpTitle": "매일의 근무 기록을 더 쉽게", "steps": [["처음 사용하기", "설정에서 근무 지역, 통화, 급여 계산 기준, 지급 주기를 정한 뒤 홈이나 달력에서 근무를 추가하세요."], ["근무 변경과 휴가", "근무 화면에서 날짜를 선택해 일정을 수정하세요. 휴무일을 선택하면 기존 근무가 교체됩니다. 근무 기록이 있다면 확인 안내를 먼저 읽어 주세요."], ["근무 시간 기록", "실제 출퇴근 시간과 무급 휴게 시간을 입력하세요. 근무 완료를 이용할 때 조기 퇴근이라면 실제 상황에 맞는 계산 방식을 선택하세요."], ["예산 설정", "수입 → 예산에서 월별 지출 한도를 정하세요. 남은 예산은 한도에서 기록한 지출을 뺀 금액이며 은행 잔액이나 받은 급여가 아닙니다."], ["백업과 복원", "기기 내 기능은 로그인 없이 사용할 수 있습니다. 설정 → 클라우드 백업에서 Google 또는 Apple로 로그인해 수동으로 백업·복원하세요. 최신 두 개를 보관하며 로그아웃만으로는 삭제되지 않습니다."], ["내보내기와 공유", "근무가 있는 기간을 선택하세요. 데이터가 없는 기간은 공유할 수 없습니다. 파일에 근무·급여 정보가 포함될 수 있으므로 공유 전 확인해 주세요."]], "contact": "문제 신고", "contactNote": "GitHub 신고는 공개됩니다. 비밀번호, 계정 식별 정보, 가리지 않은 급여 기록이나 개인정보를 올리지 마세요. 게시에는 GitHub 계정이 필요합니다. 앱 계정과 백업은 앱 안에서 삭제할 수 있습니다.", "policy": "개인정보 처리방침", "date": "시행일: 2026년 10월 12일", "sections": [["운영자와 적용 범위", "이 앱과 각 언어 버전은 독립 개발자 arvin-manager가 배포합니다. 개인정보 관련 문의는 아래 지원 채널을 이용하세요. 이 방침은 iOS 앱과 안내 웹사이트에 적용됩니다."], ["기기에 저장하는 기록", "근무, 근무 시간, 급여 설정, 지출, 앱 설정은 기기에 저장됩니다. 장부 내용을 분석이나 광고 서비스에 보내지 않습니다. 내보내기와 공유는 사용자가 실행하며, 수신자와 선택한 앱의 별도 정책이 적용될 수 있습니다."], ["선택적 로그인과 클라우드 백업", "Firebase Authentication은 Google·Apple의 제공자 식별 정보, 계정 ID, 제공되는 이메일과 표시 이름을 처리합니다. 비밀번호는 받지 않습니다. 수동 백업 시 근무·급여·지출·설정을 해당 계정의 Cloud Firestore에 저장하며 최신 두 개를 보관합니다. 압축된 데이터이며 사용자만 키를 갖는 암호화는 아닙니다. 서버 규칙으로 로그인한 동일 계정에 접근을 제한하며 Firebase가 서비스 제공을 위해 처리합니다."], ["사용 분석", "Firebase Analytics는 앱 인스턴스·기기 식별자, 앱·기기 정보, 상호작용, 네트워크 정보로 추정한 대략적 위치, 진단 정보를 처리할 수 있습니다. 기본적으로 활성화되며 설정에서 끌 수 있습니다. 자체 분석 이벤트에는 장부 금액, 근무 상세, 이메일, 계정 사용자 ID를 넣지 않습니다."], ["광고", "Google AdMob의 비개인 맞춤 광고를 제공합니다. Google과 파트너는 IP 기반 대략적 위치, 기기 식별자, 광고 표시·상호작용, 앱·기기 정보, 진단 정보를 광고 제공·측정·부정행위 방지에 사용할 수 있습니다. 비개인 맞춤 광고도 데이터 처리가 수반됩니다. 필요한 지역에서는 광고 요청 전 동의 화면을 표시하며 제공되는 경우 설정에서 선택을 바꿀 수 있습니다. 앱 간 추적 권한을 요청하지 않고 장부를 광고에 사용하지 않습니다."], ["공휴일 서비스와 웹사이트", "Nager.Date, Calendarific, 공휴일 캐시에 국가·지역과 연도를 보내며 근무나 수입은 보내지 않습니다. 네트워크 제공자는 IP와 일반 연결 정보를 받을 수 있습니다. GitHub Pages는 웹사이트를 호스팅하며 요청 로그를 보관할 수 있습니다. 이 사이트에는 분석·광고 스크립트, 로그인, 추적 쿠키가 없고 언어 선택은 URL에만 유지합니다. 신고는 GitHub 정책에 따라 처리됩니다."], ["보관과 삭제", "기록은 삭제하거나 앱을 제거할 때까지 기기에 남으며 기기 백업은 OS 설정에 따릅니다. 클라우드 백업은 삭제·계정 삭제·이전 버전 교체까지 보관하고 최신 두 개만 유지합니다. 설정 → 클라우드 백업에서 필요한 재인증 후 삭제할 수 있으며 기기 기록은 지워지지 않습니다. 분석·광고 제공자는 자체 보관 규칙을 적용합니다. 수집을 끈다고 기존 데이터가 자동 삭제되지는 않습니다."], ["선택과 권리", "로그인 없이 사용, 기록 내보내기, 분석 끄기, 제공되는 광고 동의 관리, 클라우드 백업·계정 삭제가 가능합니다. 거주 지역의 법에 따라 접근·정정·삭제·처리 반대·동의 철회·감독 기관에 대한 이의 제기 등의 권리가 있을 수 있습니다. 앱에서 처리할 수 없는 요청은 지원 채널로 문의하고 공개 게시물에 개인정보를 넣지 마세요."], ["보안과 해외 처리", "HTTPS를 사용하며 Firebase 접근 제어와 제공자의 보안 조치를 적용합니다. Cloud Firestore는 미국에 있고 Google, Apple, GitHub는 다른 국가에서도 처리할 수 있습니다. 모든 저장·전송 방식에 완전한 보안을 보장할 수 없으며 백업은 종단 간 암호화가 아닙니다."], ["아동과 변경", "개인 근무 기록 도구이며 아동용으로 설계되지 않았습니다. 아동 정보를 의도적으로 요청하지 않습니다. 관련 정보가 제공되었다고 생각되면 지원 채널로 알려 주세요. 기능이나 제공자 변경 시 방침과 시행일을 갱신할 수 있습니다."]]}, "de": {"name": "Schichtbuch", "home": "Überblick", "help": "Hilfe", "privacy": "Datenschutz", "tag": "Schichten, Stunden und Lohn an einem Ort.", "intro": "Plane wechselnde Schichten, erfasse deine tatsächliche Arbeitszeit und behalte geschätzten Lohn und dein monatliches Ausgabenbudget im Blick.", "features": ["Eigene Namen, Zeiten und Farben für Schichten. Wiederkehrende Pläne erstellen oder einen freien Tag eintragen.", "Arbeitsbeginn und -ende, unbezahlte Pausen und Zuschläge erfassen. Bei früherem Feierabend die Erfassungsweise auswählen.", "Lohn auf Grundlage deiner Einstellungen schätzen, Ausgaben erfassen und ein monatliches Ausgabenlimit festlegen.", "Schichtkalender teilen oder einen frei gewählten Zeitraum als CSV, PDF oder Bild exportieren."], "helpTitle": "Hilfe für deinen Arbeitsalltag", "steps": [["Erste Schritte", "Wähle in den Einstellungen Arbeitsregion, Währung, Lohnregeln und Abrechnungszeitraum. Füge anschließend auf der Startseite oder im Kalender eine Schicht hinzu."], ["Schicht ändern oder frei nehmen", "Wähle das Datum unter Schichten und bearbeite den Plan. Ein freier Tag ersetzt die geplante Schicht. Lies die Bestätigung, falls bereits Arbeitszeiten erfasst sind."], ["Arbeitszeit erfassen", "Trage tatsächlichen Beginn, Ende und unbezahlte Pausen ein. Über Schicht abschließen geht es schneller; bei früherem Feierabend wähle die passende Berechnung."], ["Budget einstellen", "Lege unter Einnahmen → Budget ein monatliches Ausgabenlimit fest. Das Restbudget ist dieses Limit minus erfasste Ausgaben, kein Kontostand und kein ausgezahlter Lohn."], ["Sichern und wiederherstellen", "Lokale Funktionen brauchen kein Konto. Unter Einstellungen → Cloud-Backup kannst du dich mit Google oder Apple anmelden und manuell sichern oder wiederherstellen. Die letzten zwei Sicherungen bleiben erhalten; Abmelden löscht sie nicht."], ["Exportieren und teilen", "Wähle einen Zeitraum mit geplanten Schichten. Leere Zeiträume lassen sich nicht teilen. Prüfe Dateien vor dem Teilen, da sie persönliche Arbeits- oder Lohndaten enthalten können."]], "contact": "Problem melden", "contactNote": "GitHub-Issues sind öffentlich. Veröffentliche keine Passwörter, Kontokennungen, ungeschwärzten Lohndaten oder anderen privaten Angaben. Zum Schreiben brauchst du ein GitHub-Konto. App-Konto und Backups kannst du direkt in der App löschen.", "policy": "Datenschutzerklärung", "date": "Gültig ab: 12. Oktober 2026", "sections": [["Betreiber und Geltungsbereich", "Die App und ihre Sprachversionen werden vom unabhängigen Entwickler arvin-manager veröffentlicht. Datenschutzfragen kannst du über den unten genannten Support stellen. Diese Erklärung gilt für die iOS-App und diese Informationswebsite."], ["Daten auf deinem Gerät", "Schichten, Arbeitszeiten, Lohneinstellungen, Ausgaben und Einstellungen werden lokal gespeichert. Wir senden die Inhalte deiner Aufzeichnungen nicht an Analyse- oder Werbedienste. Export und Teilen werden von dir ausgelöst; für Empfänger und gewählte Apps können eigene Datenschutzregeln gelten."], ["Optionale Anmeldung und Cloud-Backup", "Firebase Authentication verarbeitet die Identität bei Google oder Apple, die Konto-ID sowie übermittelte E-Mail-Adresse und Anzeigenamen. Wir erhalten dein Google- oder Apple-Passwort nicht. Bei einer manuellen Sicherung werden Schichten, Stunden, Lohn, Ausgaben und Einstellungen in Cloud Firestore unter deinem Konto gespeichert. Es bleiben zwei aktuelle Backups. Die Daten sind komprimiert und nicht mit einem ausschließlich von dir gehaltenen Schlüssel verschlüsselt. Serverregeln beschränken den Zugriff auf das angemeldete Konto; Firebase verarbeitet Daten zur Bereitstellung des Dienstes."], ["Nutzungsanalyse", "Firebase Analytics kann App-Instanz- und Gerätekennungen, App-/Gerätedaten, Interaktionen, aus Netzwerkdaten abgeleitete ungefähre Standorte und Diagnosedaten verarbeiten. Die Analyse ist zunächst aktiviert und kann in den Einstellungen ausgeschaltet werden. Eigene Analyseereignisse enthalten keine Beträge, Schichtdetails, E-Mail-Adressen oder Benutzer-ID des Kontos."], ["Werbung", "Google AdMob zeigt nicht personalisierte Werbung. Google und Partner können IP-basierten ungefähren Standort, Gerätekennungen, Anzeigenaufrufe und Interaktionen, App-/Gerätedaten und Diagnosedaten für Auslieferung, Messung und Betrugsprävention verarbeiten. Auch nicht personalisierte Werbung verarbeitet Daten. Wo erforderlich erscheint vor zulässigen Anzeigenanfragen ein Einwilligungsformular; angebotene Datenschutzoptionen findest du in den Einstellungen. Wir fragen keine Erlaubnis für appübergreifendes Tracking ab und nutzen deine Aufzeichnungen nicht für Werbung."], ["Feiertage und Website", "Nager.Date, Calendarific und der Feiertags-Cache erhalten das gewählte Land bzw. die Region und das Jahr, keine Schichten oder Einnahmen. Anbieter können IP-Adressen und übliche Verbindungsdaten erhalten. GitHub Pages hostet die Website und kann Zugriffsprotokolle speichern. Die Website enthält keine Analyse- oder Werbeskripte, Anmeldung oder Tracking-Cookies; die Sprachwahl bleibt nur in der URL. GitHub verarbeitet Issues nach eigenen Regeln."], ["Speicherung und Löschung", "Lokale Daten bleiben bis zum Löschen oder Entfernen der App erhalten, Gerätebackups richten sich nach den Systemeinstellungen. Cloud-Backups bleiben bis zur Löschung, Kontolöschung oder Ersetzung einer älteren Version; höchstens zwei aktuelle Versionen bleiben. Unter Einstellungen → Cloud-Backup kannst du Backups oder das App-Konto löschen, gegebenenfalls nach erneuter Anmeldung. Lokale Daten bleiben dabei erhalten. Analyse- und Werbeanbieter haben eigene Speicherfristen; Abschalten löscht bereits erhobene Daten nicht rückwirkend."], ["Wahlmöglichkeiten und Rechte", "Du kannst die lokalen Funktionen ohne Konto nutzen, Aufzeichnungen exportieren, Analyse ausschalten, verfügbare Werbeeinwilligungen ändern und Cloud-Backups oder das Konto löschen. Je nach Wohnort stehen dir unter anderem Auskunft, Berichtigung, Löschung, Widerspruch, Widerruf und Beschwerde bei einer Aufsichtsbehörde zu. Wende dich für Anliegen außerhalb der App an den Support und veröffentliche keine privaten Daten in einem Issue."], ["Sicherheit und internationale Verarbeitung", "Anfragen verwenden HTTPS. Firebase-Zugriffsregeln und Schutzmaßnahmen der Anbieter sichern die Cloud-Daten. Cloud Firestore befindet sich in den USA; Google, Apple und GitHub können Daten auch in anderen Ländern verarbeiten. Kein Speicher- oder Übertragungsverfahren ist vollständig sicher. Backups sind nicht Ende-zu-Ende-verschlüsselt."], ["Kinder und Änderungen", "Die App dient persönlichen Arbeitsaufzeichnungen u
